name: Activity Graph

on:
  schedule:
    - cron: "17 6,18 * * *"  # every 12h
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/*.py"
      - ".github/workflows/activity-graph.yml"

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render daily activity graph SVG
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_LOGIN: Manan-byte
          OUT: assets/cards/activity-graph.svg
        run: python .github/scripts/activity_graph.py

      - name: Render stats and streak SVGs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_LOGIN: Manan-byte
          STAT_OUT: assets/cards/stats.svg
          STREAK_OUT: assets/cards/streak.svg
        run: python .github/scripts/github_stats.py

      - name: Skip commit if unchanged
        id: diff
        run: |
          if git diff --quiet -- assets/cards/activity-graph.svg assets/cards/stats.svg assets/cards/streak.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push SVGs
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add assets/cards/activity-graph.svg assets/cards/stats.svg assets/cards/streak.svg
          git commit -m "chore: update profile cards"
          git push origin main
