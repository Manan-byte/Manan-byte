<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Neon Glow Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Floor Isometric Tile Pattern -->
    <pattern id="isoGrid" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17.32 L 30 34.64 L 0 17.32 Z" fill="none" stroke="#1e293b" stroke-width="0.75" />
    </pattern>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .holo-text { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #38bdf8; }
    .screen-text { font-family: 'Fira Code', Consolas, monospace; font-size: 9px; fill: #34d399; }
    .badge-title { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
  </style>

  <!-- Container -->
  <rect width="900" height="420" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Isometric Floor Grid with Radial Mask -->
  <rect x="50" y="80" width="800" height="300" fill="url(#isoGrid)" opacity="0.6" />

  <!-- Ambient Light Cone -->
  <ellipse cx="450" cy="240" rx="360" ry="120" fill="#38bdf8" opacity="0.04" />

  <!-- ================= 3D ISOMETRIC DESK SETUP ================= -->
  <g transform="translate(180, 110)">
    <!-- Desk Shadow -->
    <polygon points="120,220 420,220 340,265 40,265" fill="#000000" opacity="0.4" />

    <!-- Desk Legs -->
    <rect x="70" y="160" width="8" height="75" rx="2" fill="#334155" />
    <rect x="380" y="160" width="8" height="75" rx="2" fill="#334155" />
    <rect x="130" y="180" width="8" height="70" rx="2" fill="#1e293b" />
    <rect x="440" y="180" width="8" height="70" rx="2" fill="#1e293b" />

    <!-- Desk Top Surface (Isometric Angle) -->
    <!-- Top Face -->
    <polygon points="100,120 460,120 400,165 40,165" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <!-- Front Face -->
    <polygon points="40,165 400,165 400,175 40,175" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <!-- Right Face -->
    <polygon points="400,165 460,120 460,130 400,175" fill="#0b0f19" stroke="#334155" stroke-width="1" />

    <!-- LED Underglow Strip -->
    <line x1="42" y1="175" x2="398" y2="175" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonBlur)">
      <animate attributeName="stroke" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="5s" repeatCount="indefinite" />
    </line>

    <!-- Monitor 1 (Main - Coding Screen) -->
    <g transform="translate(130, 45)">
      <!-- Stand -->
      <polygon points="55,85 75,85 70,95 60,95" fill="#475569" />
      <rect x="62" y="70" width="6" height="20" fill="#64748b" />
      <!-- Bezel -->
      <polygon points="10,0 120,0 115,70 5,70" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Screen Glow -->
      <polygon points="12,2 118,2 113,68 7,68" fill="#090d16" />
      <!-- Code Lines -->
      <line x1="18" y1="12" x2="60" y2="12" stroke="#38bdf8" stroke-width="2" />
      <line x1="18" y1="20" x2="95" y2="20" stroke="#34d399" stroke-width="2" />
      <line x1="25" y1="28" x2="80" y2="28" stroke="#f43f5e" stroke-width="2" />
      <line x1="25" y1="36" x2="105" y2="36" stroke="#fbbf24" stroke-width="2" />
      <line x1="18" y1="44" x2="50" y2="44" stroke="#c084fc" stroke-width="2" />
      <!-- Typing Cursor -->
      <rect x="55" y="42" width="4" height="6" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Monitor 2 (Vertical - Metrics & Test Runners) -->
    <g transform="translate(260, 25)">
      <!-- Stand -->
      <polygon points="35,105 50,105 48,115 37,115" fill="#475569" />
      <rect x="40" y="90" width="5" height="20" fill="#64748b" />
      <!-- Bezel -->
      <polygon points="5,0 75,0 70,90 0,90" fill="#020617" stroke="#818cf8" stroke-width="1.5" />
      <polygon points="7,2 73,2 68,88 2,88" fill="#090d16" />
      <!-- Metrics Bars -->
      <rect x="12" y="15" width="45" height="4" rx="1" fill="#38bdf8" />
      <rect x="12" y="24" width="30" height="4" rx="1" fill="#10b981" />
      <rect x="12" y="33" width="50" height="4" rx="1" fill="#c084fc" />
      <rect x="12" y="42" width="20" height="4" rx="1" fill="#f59e0b" />
      <!-- Animated Test Runner Bar -->
      <rect x="12" y="60" width="45" height="5" rx="2" fill="#1e293b" />
      <rect x="12" y="60" width="20" height="5" rx="2" fill="#10b981">
        <animate attributeName="width" values="10;45;10" dur="2.5s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Keyboard & Mouse -->
    <polygon points="170,140 250,140 240,158 160,158" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <ellipse cx="270" cy="149" rx="6" ry="9" fill="#0f172a" stroke="#334155" stroke-width="1" />

    <!-- Coffee Mug -->
    <cylinder>
      <ellipse cx="120" cy="145" rx="6" ry="3" fill="#334155" />
      <rect x="114" y="145" width="12" height="12" fill="#475569" />
      <ellipse cx="120" cy="157" rx="6" ry="3" fill="#64748b" />
      <!-- Rising Steam Animation -->
      <path d="M 118 142 Q 116 135 120 128" stroke="#cbd5e1" stroke-width="1" fill="none" opacity="0.6">
        <animate attributeName="d" values="M 118 142 Q 116 135 120 128; M 119 142 Q 122 135 118 128; M 118 142 Q 116 135 120 128" dur="2s" repeatCount="indefinite" />
      </path>
    </cylinder>

    <!-- 3D Mini Server Tower -->
    <g transform="translate(370, 75)">
      <!-- Left Face -->
      <polygon points="0,20 40,0 40,85 0,105" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Right Face -->
      <polygon points="40,0 70,12 70,97 40,85" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <!-- Top Face -->
      <polygon points="0,20 40,0 70,12 30,32" fill="#334155" stroke="#475569" stroke-width="1" />
      <!-- Server Activity LEDs -->
      <circle cx="15" cy="45" r="2.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="15" cy="55" r="2.5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="0.9s" repeatCount="indefinite" />
      </circle>
      <circle cx="15" cy="65" r="2.5" fill="#c084fc">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="15" cy="75" r="2.5" fill="#ef4444">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- ================= FLOATING 3D HOLOGRAPHIC TILES ================= -->
  <!-- Hologram 1: QA Automation (Left) -->
  <g transform="translate(70, 70)">
    <animateTransform attributeName="transform" type="translate" values="70,70; 70,62; 70,70" dur="4s" repeatCount="indefinite" />
    <polygon points="0,20 90,0 130,25 40,45" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5" filter="url(#neonBlur)" />
    <text x="65" y="27" fill="#34d399" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">🎭 Playwright</text>
  </g>

  <!-- Hologram 2: Cloudflare Edge (Right) -->
  <g transform="translate(680, 80)">
    <animateTransform attributeName="transform" type="translate" values="680,80; 680,88; 680,80" dur="3.5s" repeatCount="indefinite" />
    <polygon points="0,20 90,0 130,25 40,45" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" filter="url(#neonBlur)" />
    <text x="65" y="27" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">☁️ Edge D1</text>
  </g>

  <!-- Hologram 3: WebRTC SFU (Bottom Right) -->
  <g transform="translate(690, 230)">
    <animateTransform attributeName="transform" type="translate" values="690,230; 690,222; 690,230" dur="4.5s" repeatCount="indefinite" />
    <polygon points="0,20 90,0 130,25 40,45" fill="#0f172a" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.5" filter="url(#neonBlur)" />
    <text x="65" y="27" fill="#c084fc" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">📹 LiveKit SFU</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(450, 40)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="1.5px">3D CYBER WORKSPACE &amp; EDGE DIAGNOSTICS</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">ISOMETRIC WORKSTATION // MANAN-BYTE</text>
  </g>
</svg>