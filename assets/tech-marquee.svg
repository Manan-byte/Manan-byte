<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" width="100%" height="90">
  <defs>
    <linearGradient id="trackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <style>
    .pill { fill: #1e293b; stroke: #334155; stroke-width: 1.2; rx: 8; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .icon { font-size: 13px; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="86" rx="12" fill="url(#trackBg)" stroke="url(#neonGlow)" stroke-width="1.5" />

  <!-- Continuous Moving Track (Seamless Infinite Loop) -->
  <g transform="translate(0, 26)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-980 0" dur="20s" repeatCount="indefinite" />

      <!-- Set 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="34" class="pill" stroke="#10b981" />
        <text x="55" y="22" class="txt">🎭 Playwright</text>

        <rect x="120" y="0" width="85" height="34" class="pill" stroke="#10b981" />
        <text x="162" y="22" class="txt">🃏 Jest</text>

        <rect x="215" y="0" width="95" height="34" class="pill" stroke="#10b981" />
        <text x="262" y="22" class="txt">🌐 Selenium</text>

        <rect x="320" y="0" width="95" height="34" class="pill" stroke="#10b981" />
        <text x="367" y="22" class="txt">🚀 Postman</text>

        <rect x="425" y="0" width="110" height="34" class="pill" stroke="#38bdf8" />
        <text x="480" y="22" class="txt">📘 TypeScript</text>

        <rect x="545" y="0" width="85" height="34" class="pill" stroke="#38bdf8" />
        <text x="587" y="22" class="txt">⚛️ React</text>

        <rect x="640" y="0" width="115" height="34" class="pill" stroke="#38bdf8" />
        <text x="697" y="22" class="txt">🎨 Tailwind CSS</text>

        <rect x="765" y="0" width="135" height="34" class="pill" stroke="#f59e0b" />
        <text x="832" y="22" class="txt">☁️ Cloudflare Edge</text>

        <rect x="910" y="0" width="85" height="34" class="pill" stroke="#f59e0b" />
        <text x="952" y="22" class="txt">🟢 Node.js</text>

        <rect x="1005" y="0" width="85" height="34" class="pill" stroke="#c084fc" />
        <text x="1047" y="22" class="txt">🐳 Docker</text>
      </g>

      <!-- Set 2 (Identical duplicate for seamless looping) -->
      <g transform="translate(980, 0)">
        <rect x="0" y="0" width="110" height="34" class="pill" stroke="#10b981" />
        <text x="55" y="22" class="txt">🎭 Playwright</text>

        <rect x="120" y="0" width="85" height="34" class="pill" stroke="#10b981" />
        <text x="162" y="22" class="txt">🃏 Jest</text>

        <rect x="215" y="0" width="95" height="34" class="pill" stroke="#10b981" />
        <text x="262" y="22" class="txt">🌐 Selenium</text>

        <rect x="320" y="0" width="95" height="34" class="pill" stroke="#10b981" />
        <text x="367" y="22" class="txt">🚀 Postman</text>

        <rect x="425" y="0" width="110" height="34" class="pill" stroke="#38bdf8" />
        <text x="480" y="22" class="txt">📘 TypeScript</text>

        <rect x="545" y="0" width="85" height="34" class="pill" stroke="#38bdf8" />
        <text x="587" y="22" class="txt">⚛️ React</text>

        <rect x="640" y="0" width="115" height="34" class="pill" stroke="#38bdf8" />
        <text x="697" y="22" class="txt">🎨 Tailwind CSS</text>

        <rect x="765" y="0" width="135" height="34" class="pill" stroke="#f59e0b" />
        <text x="832" y="22" class="txt">☁️ Cloudflare Edge</text>

        <rect x="910" y="0" width="85" height="34" class="pill" stroke="#f59e0b" />
        <text x="952" y="22" class="txt">🟢 Node.js</text>

        <rect x="1005" y="0" width="85" height="34" class="pill" stroke="#c084fc" />
        <text x="1047" y="22" class="txt">🐳 Docker</text>
      </g>
    </g>
  </g>
</svg>