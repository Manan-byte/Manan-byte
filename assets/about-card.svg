<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="320">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-bar { fill: #1e293b; }
    .window-border { stroke: url(#borderGrad); stroke-width: 1.5; rx: 12; fill: url(#cardGrad); }
    .code-text { font-family: 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, monospace; font-size: 13.5px; fill: #cbd5e1; }
    .keyword { fill: #f43f5e; font-weight: 600; }
    .prop { fill: #38bdf8; }
    .string { fill: #34d399; }
    .bracket { fill: #fbbf24; }
    .comment { fill: #64748b; font-style: italic; }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      fill: #38bdf8;
      animation: blink 1s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.25)); }
      50% { filter: drop-shadow(0 0 14px rgba(129, 140, 248, 0.45)); }
    }
    .main-window {
      animation: pulseGlow 4s ease-in-out infinite;
    }
  </style>

  <g class="main-window">
    <!-- Window Body -->
    <rect x="5" y="5" width="790" height="310" class="window-border" />
    <!-- Window Title Bar -->
    <path d="M 5 17 Q 5 5 17 5 L 783 5 Q 795 5 795 17 L 795 38 L 5 38 Z" class="title-bar" />
    <!-- Window Controls -->
    <circle cx="25" cy="21" r="6" fill="#ef4444" />
    <circle cx="45" cy="21" r="6" fill="#f59e0b" />
    <circle cx="65" cy="21" r="6" fill="#10b981" />
    <text x="400" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94a3b8">abdul-manan.config.ts — bash</text>
  </g>

  <!-- Content Lines -->
  <g class="code-text" transform="translate(30, 68)">
    <text y="0"><tspan class="comment">// Professional Profile &amp; Core Architecture</tspan></text>
    <text y="24"><tspan class="keyword">const</tspan> <tspan class="prop">engineer</tspan> = <tspan class="bracket">{</tspan></text>
    <text y="48">&nbsp;&nbsp;<tspan class="prop">name</tspan>: <tspan class="string">"Abdul Manan"</tspan>,</text>
    <text y="72">&nbsp;&nbsp;<tspan class="prop">role</tspan>: <tspan class="string">"Quality Assurance Engineer &amp; Fullstack Edge Developer"</tspan>,</text>
    <text y="96">&nbsp;&nbsp;<tspan class="prop">organization</tspan>: <tspan class="string">"Suiflex (suiflex.dev)"</tspan>,</text>
    <text y="120">&nbsp;&nbsp;<tspan class="prop">portfolio</tspan>: <tspan class="string">"portfolio-abdul-manan.pages.dev"</tspan>,</text>
    <text y="144">&nbsp;&nbsp;<tspan class="prop">specialties</tspan>: <tspan class="bracket">[</tspan><tspan class="string">"E2E Automation"</tspan>, <tspan class="string">"Playwright"</tspan>, <tspan class="string">"Cloudflare Edge"</tspan>, <tspan class="string">"LiveKit SFU"</tspan><tspan class="bracket">]</tspan>,</text>
    <text y="168">&nbsp;&nbsp;<tspan class="prop">mission</tspan>: <tspan class="string">"Building deterministic, ultra-reliable edge software"</tspan>,</text>
    <text y="192">&nbsp;&nbsp;<tspan class="prop">location</tspan>: <tspan class="string">"Indonesia 🇮🇩"</tspan></text>
    <text y="216"><tspan class="bracket">}</tspan>;</text>
    <text y="240"><tspan class="comment">> System initialized ready for production</tspan><tspan class="cursor">_</tspan></text>
  </g>
</svg>