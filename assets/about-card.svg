<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="340">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGradAnim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#10b981;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#10b981;#38bdf8;#818cf8;#c084fc" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Sweeping light scanner -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .title-bar { fill: #1e293b; }
    .code-text { font-family: 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, monospace; font-size: 13.5px; fill: #cbd5e1; }
    .keyword { fill: #f43f5e; font-weight: 600; }
    .prop { fill: #38bdf8; }
    .string { fill: #34d399; }
    .bracket { fill: #fbbf24; }
    .comment { fill: #64748b; font-style: italic; }
  </style>

  <!-- Container Box -->
  <rect x="4" y="4" width="792" height="332" rx="14" fill="url(#cardBg)" stroke="url(#borderGradAnim)" stroke-width="2" />

  <!-- Sweeping Laser Scan -->
  <rect x="-100" y="4" width="120" height="332" fill="url(#sweepGrad)">
    <animate attributeName="x" values="-120;820;-120" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- Title Bar -->
  <path d="M 4 18 Q 4 4 18 4 L 782 4 Q 796 4 796 18 L 796 38 L 4 38 Z" class="title-bar" />
  <circle cx="25" cy="21" r="6" fill="#ef4444" />
  <circle cx="45" cy="21" r="6" fill="#f59e0b" />
  <circle cx="65" cy="21" r="6" fill="#10b981" />
  <text x="400" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94a3b8">abdul-manan.config.ts — bash</text>

  <!-- Content Lines -->
  <g class="code-text" transform="translate(30, 72)">
    <text y="0"><tspan class="comment">// Professional Profile &amp; Core Architecture</tspan></text>
    <text y="24"><tspan class="keyword">const</tspan> <tspan class="prop">engineer</tspan> = <tspan class="bracket">{</tspan></text>
    <text y="48">&nbsp;&nbsp;<tspan class="prop">name</tspan>: <tspan class="string">"Abdul Manan"</tspan>,</text>
    <text y="72">&nbsp;&nbsp;<tspan class="prop">role</tspan>: <tspan class="string">"Quality Assurance Engineer &amp; Fullstack Edge Developer"</tspan>,</text>
    <text y="96">&nbsp;&nbsp;<tspan class="prop">organization</tspan>: <tspan class="string">"Suiflex (suiflex.dev)"</tspan>,</text>
    <text y="120">&nbsp;&nbsp;<tspan class="prop">portfolio</tspan>: <tspan class="string">"portfolio-abdul-manan.pages.dev"</tspan>,</text>
    <text y="144">&nbsp;&nbsp;<tspan class="prop">specialties</tspan>: <tspan class="bracket">[</tspan><tspan class="string">"E2E Automation"</tspan>, <tspan class="string">"Playwright"</tspan>, <tspan class="string">"Cloudflare Edge"</tspan>, <tspan class="string">"LiveKit SFU"</tspan><tspan class="bracket">]</tspan>,</text>
    <text y="168">&nbsp;&nbsp;<tspan class="prop">mission</tspan>: <tspan class="string">"Building deterministic, ultra-reliable edge software"</tspan>,</text>
    <text y="192">&nbsp;&nbsp;<tspan class="prop">location</tspan>: <tspan class="string">"Indonesia 🇮🇩"</tspan></text>
    <text y="216"><tspan class="bracket">}</tspan>;</text>
    <text y="240"><tspan class="comment">> System initialized ready for production</tspan></text>
    
    <!-- Native Animated Blinking Cursor -->
    <rect x="360" y="228" width="8" height="15" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>